name: MH Browser Windows installer
on:
  push:
    branches: [main, feature/windows-desktop-browser]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate MH Browser Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -c "from PIL import Image,ImageDraw,ImageFilter; im=Image.open('ui/assets/mh-logo.webp').convert('RGBA'); mask=Image.new('L',im.size,0); ImageDraw.Draw(mask).rounded_rectangle((5,5,im.width-6,im.height-6),radius=28,fill=255); im.putalpha(mask.filter(ImageFilter.GaussianBlur(.5))); im=im.resize((512,512),Image.Resampling.LANCZOS).filter(ImageFilter.UnsharpMask(radius=1.35,percent=135,threshold=3)); im.save('ui/assets/mh-logo-clean.png'); im=im.resize((256,256),Image.Resampling.LANCZOS); im.save('build/mh-browser.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          python -c "from PIL import Image,ImageDraw; src=Image.open('ui/assets/mh-logo-clean.png').convert('RGBA'); canvas=Image.new('RGB',(164,314),'#071326'); logo=src.resize((144,144),Image.Resampling.LANCZOS); canvas.paste(logo,(10,48),logo.getchannel('A')); ImageDraw.Draw(canvas).text((32,206),'MH BROWSER',fill='#ffffff'); canvas.save('build/installer-sidebar.bmp'); header=Image.new('RGB',(150,57),'#10223a'); small=src.resize((49,49),Image.Resampling.LANCZOS); header.paste(small,(4,4),small.getchannel('A')); ImageDraw.Draw(header).text((57,21),'MH Browser',fill='#ffffff'); header.save('build/installer-header.bmp')"
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Download FFmpeg for HLS and MP3 conversion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path media-tools | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName media-tools/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName media-tools/ffprobe.exe
      - name: Download verified public-site media component
        shell: pwsh
        run: |
          $version = '2026.08.19'
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$version"
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile 'yt-dlp-checksums.txt'
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile 'media-tools/yt-dlp.exe'
          $checksums = Get-Content 'yt-dlp-checksums.txt' -Raw
          $match = [regex]::Match($checksums, '(?m)^([0-9a-fA-F]{64})\s+\*?yt-dlp\.exe\s*
        shell: pwsh
        run: |
          node --check main.js
          node --check media.js
          node --check site-media.js
          node --check ui/app.js
          if (-not (Test-Path 'ui/assets/mh-logo-clean.png')) { throw 'Clean logo not generated' }
          if (-not (Test-Path 'build/mh-browser.ico')) { throw 'Windows icon not generated' }
      - name: Build EXE setup
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MH-Browser-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
)
          if (-not $match.Success) { throw 'yt-dlp checksum not found' }
          $actual = (Get-FileHash 'media-tools/yt-dlp.exe' -Algorithm SHA256).Hash
          if ($actual -ne $match.Groups[1].Value.ToUpperInvariant()) { throw 'yt-dlp SHA256 verification failed' }
      - name: Validate browser JavaScript and generated branding
        shell: pwsh
        run: |
          node --check main.js
          node --check media.js
          node --check ui/app.js
          if (-not (Test-Path 'ui/assets/mh-logo-clean.png')) { throw 'Clean logo not generated' }
          if (-not (Test-Path 'build/mh-browser.ico')) { throw 'Windows icon not generated' }
      - name: Build EXE setup
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MH-Browser-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
