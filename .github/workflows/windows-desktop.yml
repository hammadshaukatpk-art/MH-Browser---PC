name: MH Browser Windows installer
on:
  push:
    branches: [main, feature/windows-desktop-browser]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate branded icon and installer artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -c "from PIL import Image,ImageDraw,ImageFilter,ImageChops; im=Image.open('ui/assets/mh-logo.webp').convert('RGBA'); mask=Image.new('L',im.size,0); ImageDraw.Draw(mask).rounded_rectangle((2,2,im.width-3,im.height-3),radius=int(im.width*.20),fill=255); im.putalpha(ImageChops.multiply(im.getchannel('A'),mask.filter(ImageFilter.GaussianBlur(.5)))); im=im.resize((512,512),Image.Resampling.LANCZOS).filter(ImageFilter.UnsharpMask(radius=1.0,percent=110,threshold=3)); im.save('ui/assets/mh-logo-clean.png'); im=im.resize((256,256),Image.Resampling.LANCZOS); im.save('build/mh-browser.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          python -c "from PIL import Image,ImageDraw; src=Image.open('ui/assets/mh-logo-clean.png').convert('RGBA'); canvas=Image.new('RGB',(164,314),'#071326'); logo=src.resize((144,144),Image.Resampling.LANCZOS); canvas.paste(logo,(10,48),logo.getchannel('A')); ImageDraw.Draw(canvas).text((32,206),'MH BROWSER',fill='#ffffff'); canvas.save('build/installer-sidebar.bmp'); header=Image.new('RGB',(150,57),'#10223a'); small=src.resize((49,49),Image.Resampling.LANCZOS); header.paste(small,(4,4),small.getchannel('A')); ImageDraw.Draw(header).text((57,21),'MH Browser',fill='#ffffff'); header.save('build/installer-header.bmp')"
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path media-tools | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName media-tools/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName media-tools/ffprobe.exe
      - name: Download and verify official site-media component
        shell: pwsh
        run: |
          $version = '2026.08.19'
          $base = "https://github.com/yt-dlp/yt-dlp/releases/download/$version"
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile 'yt-dlp-checksums.txt'
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile 'media-tools/yt-dlp.exe'
          $hashLine = Get-Content 'yt-dlp-checksums.txt' | Where-Object { $_ -match 'yt-dlp[.]exe' } | Select-Object -First 1
          if (-not $hashLine) { throw 'yt-dlp checksum missing' }
          $expected = ($hashLine.Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash 'media-tools/yt-dlp.exe' -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'yt-dlp checksum mismatch' }
      - name: Validate desktop scripts and assets
        shell: pwsh
        run: |
          node --check main.js
          node --check media.js
          node --check site-media.js
          node --check ui/app.js
          if (-not (Test-Path 'ui/assets/mh-logo-clean.png')) { throw 'Missing MH logo' }
          if (-not (Test-Path 'build/mh-browser.ico')) { throw 'Missing Windows icon' }
      - name: Build EXE installer
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MH-Browser-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
