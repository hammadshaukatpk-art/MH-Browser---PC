name: MH Browser Windows installer
on:
  push:
    branches: [main, feature/windows-desktop-browser]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate MH Browser Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -c "from PIL import Image; im=Image.open('ui/assets/mh-logo.webp').convert('RGBA'); im.save('build/mh-browser.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64)])"
          python -c "from PIL import Image,ImageDraw; src=Image.open('ui/assets/mh-logo.webp').convert('RGB'); canvas=Image.new('RGB',(164,314),'#071326'); canvas.paste(src.resize((144,144)),(10,48)); ImageDraw.Draw(canvas).text((32,206),'MH BROWSER',fill='#ffffff'); canvas.save('build/installer-sidebar.bmp'); header=Image.new('RGB',(150,57),'#10223a'); header.paste(src.resize((49,49)),(4,4)); ImageDraw.Draw(header).text((57,21),'MH Browser',fill='#ffffff'); header.save('build/installer-header.bmp')"
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Download FFmpeg for HLS and MP3 conversion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path media-tools | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName media-tools/ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName media-tools/ffprobe.exe
      - name: Build EXE setup
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MH-Browser-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
