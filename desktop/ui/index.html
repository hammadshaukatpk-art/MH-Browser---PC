<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'none'"><title>MH Browser</title><link rel="stylesheet" href="style.css"><link rel="icon" href="assets/mh-logo-clean.png"></head><body><header><div id="tabs"><button id="add" title="New tab">+</button></div><nav><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><button id="home" title="Home">⌂</button><form id="addressForm"><span id="secure">◎</span><input id="address" placeholder="Search Google or enter a website address" autocomplete="off"></form><button id="favorite" title="Bookmark">☆</button><button id="media" title="Download available media" hidden>⇩ Media</button><button id="downloads" title="Downloads">⇩</button><div id="extensionTools" class="extension-tools" aria-label="Installed extensions"></div><button id="extensionsButton" title="Extensions">♧</button><button id="profileButton" class="profile-button" title="Google Account" aria-label="Google account options"><img src="assets/google-g.svg" alt="Google"></button><button id="menu" title="Browser menu">☰</button></nav></header><main id="homepage"><div class="brand"><div class="mark"><img src="assets/mh-logo-clean.png" alt="MH Browser"></div><h1>MH Browser</h1><p>Browse freely. Discover more.</p><button id="googleLogin" class="google-login" title="Open Google Account options">Google Account ↗</button></div><form id="searchForm"><input id="search" placeholder="Search Google or enter a URL" autofocus><button type="submit">Search</button></form><section id="privateIntro" class="private-home" hidden><h2>◈ Private Browsing</h2><p>Pages opened in private tabs are not added to your normal history. Downloads saved to your computer and activity visible to websites or your network are not hidden.</p></section><h3 id="quickTitle">Quick Access</h3><div id="shortcuts"></div></main><aside id="panel" hidden><div class="panel-head"><img src="assets/mh-logo-clean.png" alt=""><h2 id="panelTitle">Downloads</h2><button id="closePanel">✕</button></div><div id="panelContent"></div></aside><div id="dialogBackdrop" class="dialog-backdrop" hidden><section class="mh-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-brand"><img src="assets/mh-logo-clean.png" alt=""><span>MH Browser</span></div><h2 id="dialogTitle">Confirm action</h2><p id="dialogMessage"></p><input id="dialogInput" class="dialog-input" hidden><div class="dialog-actions"><button id="dialogCancel" class="secondary">Cancel</button><button id="dialogOK" class="action">Continue</button></div></section></div><script src="app.js"></script></body></html>
